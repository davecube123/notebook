<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Almanac</title>
  <meta name="description" content="Notes, your one thing, habits, a life calendar and people — in one private notebook.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Almanac">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply theme before first paint to avoid a flash
    try {
      var t = localStorage.getItem('almanac-theme'), a = localStorage.getItem('almanac-accent');
      if (t && t !== 'system') document.documentElement.dataset.theme = t;
      if (a && a !== '#E0583A') document.documentElement.style.setProperty('--accent', a);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <nav id="sidebar" aria-label="Main"></nav>
    <main id="main" tabindex="-1">
      <div class="boot"><div class="boot-mark"></div></div>
    </main>
    <nav id="tabbar" aria-label="Tabs"></nav>
  </div>
  <noscript>Almanac needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
